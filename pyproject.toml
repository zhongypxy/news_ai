[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "global-ai-daily"
version = "0.1.0"
description = "Verified global AI news, offline HTML and GitHub archives"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "feedparser>=6,<7", "PyYAML>=6,<7", "Jinja2>=3.1,<4",
  "beautifulsoup4>=4.13,<5", "python-dateutil>=2.9,<3", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "jsonschema>=4.23,<5", "ruff>=0.12,<1"]

[project.scripts]
ai-daily = "ainews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
