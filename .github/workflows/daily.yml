name: Global AI Daily
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Asia/Singapore
    - cron: '17 10 * * *'
      timezone: Asia/Singapore
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Optional historical date YYYY-MM-DD; blank uses current date (UTC+8)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: global-ai-daily-${{ github.ref }}
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Validate configuration
        run: python -m ainews.cli check
      - name: Generate verified daily report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python -m ainews.cli run --date "$REPORT_DATE"
          else
            python -m ainews.cli run
          fi
      - name: Commit successful reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data state/events.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "reports: archive verified AI daily [skip ci]"
            git push origin HEAD
          fi
      - name: Retain safe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-daily-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            state/.pending.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
