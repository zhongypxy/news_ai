<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球 AI 日报 · 历史归档</title><style>
:root{color-scheme:light dark;--bg:#f3f3f8;--surface:#fff;--fg:#181923;--muted:#686d80;--line:#e2e4ee;--accent:#5b48df;--soft:#eeeaff;--good:#17815d;--warn:#a95e12}
:root[data-theme=dark]{--bg:#10111a;--surface:#191b28;--fg:#edf0f8;--muted:#a0a6bb;--line:#303347;--accent:#b5a9ff;--soft:#2c2546;--good:#73d6ad;--warn:#ffd193}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10111a;--surface:#191b28;--fg:#edf0f8;--muted:#a0a6bb;--line:#303347;--accent:#b5a9ff;--soft:#2c2546;--good:#73d6ad;--warn:#ffd193}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button,input,select{font:inherit}button,select{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}button:hover{border-color:var(--accent)}.wrap{max-width:1160px;margin:auto;padding:0 28px}.brand{font-size:13px;font-weight:750;letter-spacing:2px}.header{border-bottom:1px solid var(--line);background:var(--surface)}.headrow{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:18px;gap:20px}.hero{padding:48px 0 30px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:3px}h1{font-size:clamp(30px,5vw,52px);line-height:1.2;margin:14px 0 18px;letter-spacing:-1px}h2{font-size:21px;margin:0 0 20px}h3{font-size:20px;line-height:1.5;margin:10px 0 16px}h4{font-size:13px;color:var(--muted);margin:20px 0 4px}.muted,.meta{color:var(--muted)}.meta{font-size:12px}.lead{font-size:17px;max-width:900px}.stats{display:flex;flex-wrap:wrap;gap:28px;margin:26px 0}.stat strong{font-size:28px;display:block;line-height:1.3}.stat span{font-size:12px;color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:20px 0}.controls input{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;border-radius:8px}.layout{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}.sidebar{position:sticky;top:20px;font-size:13px}.sidebar a{display:block;color:var(--muted);padding:9px 0}.sidebar .label{font-size:11px;letter-spacing:2px;color:var(--muted);margin:24px 0 8px}.section{padding:24px 0;scroll-margin-top:25px}.section-title{display:flex;align-items:center;gap:12px}.section-title small{color:var(--accent);font-size:12px;letter-spacing:1px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:18px;overflow-wrap:anywhere}.card:target{border-color:var(--accent)}.card p{margin:6px 0 12px}.tags{display:flex;gap:7px;flex-wrap:wrap;font-size:11px}.badge{border-radius:5px;padding:2px 8px;background:var(--soft);color:var(--accent)}.badge.p0{background:#bd304020;color:#dc5365}.badge.warn{background:#e8aa2920;color:var(--warn)}.fact-label{color:var(--good);font-size:11px;letter-spacing:1px;font-weight:700}.analysis-label{color:var(--accent);font-size:11px;letter-spacing:1px;font-weight:700}.source-list{list-style:none;padding:0;margin:8px 0}.source-list li{margin:8px 0;font-size:13px}.source-list small{display:block;color:var(--muted)}.followup{background:var(--soft);padding:14px;border-radius:8px;font-size:14px}.toplist{list-style:none;padding:0}.toplist li{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:16px}.toplist span{font-size:13px;color:var(--accent);font-weight:700}.empty{color:var(--muted);font-size:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.status-ok{color:var(--good)}.status-failed{color:var(--warn)}details{font-size:13px}summary{cursor:pointer;font-weight:600}.footer{margin-top:36px;border-top:1px solid var(--line);padding:24px 0 40px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}.archive-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.archive-grid .card{margin:0}.archive-date{font-size:25px;font-weight:700}.notice{border-left:3px solid var(--accent);padding:12px 18px;background:var(--soft);font-size:14px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:none}.wrap{padding:0 18px}.hero{padding-top:32px}.card{padding:20px}.archive-grid{grid-template-columns:1fr}.headrow{gap:8px}.brand{font-size:11px;letter-spacing:1px}.controls select{flex:1}.stats{gap:20px}.lead{font-size:15px}}
@media print{body{background:white;color:black}.sidebar,.controls,#theme{display:none}.layout{display:block}.card{break-inside:avoid;border-color:#ccc}a{color:black}.wrap{max-width:none}}
</style></head><body><header class="header"><div class="wrap headrow"><span class="brand">AI / DAILY INTELLIGENCE</span><button id="theme" aria-label="切换深色模式">◐ 外观</button></div></header><main class="wrap"><div class="hero"><div class="eyebrow">GLOBAL AI · ARCHIVE</div><h1>全球 AI 每日情报</h1><p class="lead muted">模型、Agent、开源、商业、教育与产业。以真实来源追踪每一天的重要变化。</p><p class="meta">每天 UTC+8 09:00 自动采集 · 10:17 兜底检查 · 已归档 0 期</p></div><div class="controls"><input id="search" type="search" placeholder="搜索日期或摘要…" aria-label="搜索历史日报"></div><div class="archive-grid"><div class="card"><h2>尚未生成日报</h2><p class="muted">系统已安装。配置 OpenAI API Key 并成功运行采集任务后，真实日报会出现在这里。</p><p class="notice">此页面没有演示新闻。只有通过来源、时间、事实与去重检查的结果才会进入归档。</p></div></div><p class="empty" id="no-results" hidden>没有匹配的历史日报。</p></main><footer class="footer"><div class="wrap">Global AI Daily · V2.0 · 本地离线归档 · 来源链接需要网络连接</div></footer><script>
(()=>{'use strict';const root=document.documentElement,theme=document.getElementById('theme');
try{const saved=localStorage.getItem('ai-daily-theme');if(saved==='dark'||saved==='light')root.dataset.theme=saved}catch(e){}
theme?.addEventListener('click',()=>{const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('ai-daily-theme',root.dataset.theme)}catch(e){}});
const search=document.getElementById('search'),category=document.getElementById('category'),priority=document.getElementById('priority');
const filter=()=>{const q=(search?.value||'').trim().toLocaleLowerCase();let count=0;document.querySelectorAll('[data-searchable]').forEach(card=>{const match=(!q||card.textContent.toLocaleLowerCase().includes(q))&&(!category?.value||card.dataset.category===category.value)&&(!priority?.value||card.dataset.priority===priority.value);card.hidden=!match;if(match)count++});document.querySelectorAll('[data-news-section]').forEach(section=>{section.hidden=!Array.from(section.querySelectorAll('[data-searchable]')).some(card=>!card.hidden)});const counter=document.getElementById('result-count');if(counter)counter.textContent=`显示 ${count} 条`;const empty=document.getElementById('no-results');if(empty)empty.hidden=count!==0};
[search,category,priority].forEach(el=>el?.addEventListener(el===search?'input':'change',filter));
})();
</script></body></html>
