# 单一发现入口。六领域是查询维度，不代表六个独立信息源。
sources:
  - id: aihot_latest
    name: AIHOT · 24小时精选
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [models, agents, opensource, business, applications, infrastructure]
    max_items: 30
    mcp_tool: aihot_get_latest
    mcp_arguments: {window: 24h, mode: selected, limit: 30}
  - id: aihot_models
    name: AIHOT · 模型与实验室
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [models]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [模型, OpenAI, Anthropic]
  - id: aihot_agents
    name: AIHOT · Agent与Coding
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [agents]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [Agent, Claude Code, Codex]
  - id: aihot_opensource
    name: AIHOT · 开源项目
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [opensource]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [GitHub, 开源, 逆向]
  - id: aihot_business
    name: AIHOT · 商业与创业
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [business]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [融资, 收购]
  - id: aihot_applications
    name: AIHOT · 教育与垂直应用
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [applications]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [教育, 医疗, 法律]
  - id: aihot_infrastructure
    name: AIHOT · 基础设施与政策
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [infrastructure]
    max_items: 30
    mcp_tool: aihot_search
    mcp_arguments: {window: 7d, limit: 30}
    queries: [算力, 芯片, 政策]
  - id: search_backfill
    name: AIHOT · 72小时重大事件补漏
    kind: aihot
    url: https://aihot.news/api/mcp
    allowed_domains: [aihot.news]
    region: global
    categories: [models, agents, opensource, business, applications, infrastructure]
    max_items: 30
    mcp_tool: aihot_get_latest
    # 取7天候选，核验原文后按72小时补漏窗口筛选。
    mcp_arguments: {window: 7d, mode: selected, limit: 30}
